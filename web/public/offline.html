<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="robots" content="noindex" />
    <title>Offline — Relay</title>
    <style>
      :root { color-scheme: dark light; --bg: #0b0b0c; --text: #ede9e0; --muted: #8a857c; --line: rgb(237 233 224 / 0.15); --signal: #ff5b1f; }
      @media (prefers-color-scheme: light) { :root { --bg: #f3f0e8; --text: #16150f; --muted: #6b675f; --line: rgb(22 21 15 / 0.18); --signal: #e44a0f; } }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
      body { display: grid; place-items: center; padding: 24px; box-sizing: border-box;
        background-image: radial-gradient(var(--line) 0.8px, transparent 1px); background-size: 12px 12px; }
      main { max-width: 360px; text-align: center; }
      svg { width: 44px; height: 44px; }
      svg circle { fill: var(--text); }
      svg circle.b { fill: var(--signal); animation: blink 1.2s steps(1, end) infinite; }
      @keyframes blink { 50% { opacity: 0.25; } }
      @media (prefers-reduced-motion: reduce) { svg circle.b { animation: none; } }
      h1 { margin: 20px 0 6px; font-size: 22px; letter-spacing: -0.02em; }
      p { margin: 0 0 20px; color: var(--muted); }
      a { display: inline-block; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--line); color: var(--text); text-decoration: none; font-weight: 600; }
      a:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 7 7" aria-hidden="true"><circle cx="1.5" cy="1.5" r=".41"/><circle cx="2.5" cy="1.5" r=".41"/><circle cx="3.5" cy="1.5" r=".41"/><circle class="b" cx="4.5" cy="1.5" r=".5"/><circle cx="1.5" cy="2.5" r=".41"/><circle cx="4.5" cy="2.5" r=".41"/><circle cx="1.5" cy="3.5" r=".41"/><circle cx="2.5" cy="3.5" r=".41"/><circle cx="3.5" cy="3.5" r=".41"/><circle cx="1.5" cy="4.5" r=".41"/><circle cx="3.5" cy="4.5" r=".41"/><circle cx="1.5" cy="5.5" r=".41"/><circle cx="4.5" cy="5.5" r=".41"/></svg>
      <h1>You’re offline</h1>
      <p>This device can’t reach your machine right now. Your terminals and agents keep running there.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
